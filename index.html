<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#9cb1c9">
  <title>Una sorpresa para ti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="index-image-page">
  <div class="index-image-overlay" aria-hidden="true"></div>

  <main id="screen-lock" class="screen">
    <section class="lock-card" aria-labelledby="lock-title">
      <img class="lock-snoopy" src="Doc/snoopy1.png" alt="Snoopy" draggable="false">
      <p class="eyebrow">Tengo una sorpresa para ti ✨</p>
      <h1 class="title" id="lock-title">Ingresa el código</h1>
      <p class="subtitle">Descubre la combinación de 4 números.</p>

      <div class="pin-display" aria-label="Código ingresado" aria-live="polite">
        <div class="pin-box" id="box-0"></div>
        <div class="pin-box" id="box-1"></div>
        <div class="pin-box" id="box-2"></div>
        <div class="pin-box" id="box-3"></div>
      </div>

      <div class="keypad" aria-label="Teclado numérico">
        <button type="button" class="key" data-val="1" aria-label="1">1</button>
        <button type="button" class="key" data-val="2" aria-label="2">2</button>
        <button type="button" class="key" data-val="3" aria-label="3">3</button>
        <button type="button" class="key" data-val="4" aria-label="4">4</button>
        <button type="button" class="key" data-val="5" aria-label="5">5</button>
        <button type="button" class="key" data-val="6" aria-label="6">6</button>
        <button type="button" class="key" data-val="7" aria-label="7">7</button>
        <button type="button" class="key" data-val="8" aria-label="8">8</button>
        <button type="button" class="key" data-val="9" aria-label="9">9</button>
        <button type="button" class="key action-key" id="btn-clear" aria-label="Borrar todo">C</button>
        <button type="button" class="key" data-val="0" aria-label="0">0</button>
        <button type="button" class="key action-key" id="btn-back" aria-label="Borrar último número">⌫</button>
      </div>

      <div class="feedback-modal hidden" id="feedback-modal" role="status" aria-live="polite">
        <div class="feedback-content">
          <img id="feedback-img" src="Doc/snoopy1.png" alt="Snoopy">
          <p id="feedback-text"></p>
        </div>
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
